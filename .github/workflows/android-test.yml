name: Android CI
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.repository }}-${{ github.ref_name }}-android
  cancel-in-progress: true
jobs:
  minutes-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy `tools` package, which the SDK repository no longer has.
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only a manual main run may populate caches; PRs and other refs only restore.
          cache-read-only: true
      - name: Restore public Robolectric runtime dependencies
        id: robolectric
        uses: actions/cache/restore@v4
        with:
          # Never cache Maven settings, credentials or unrelated/private artifacts.
          path: |
            ~/.m2/repository/org/robolectric/android-all
            ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ runner.os }}-robolectric-v1-inline-code-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          # Another lane's entry, or one saved under an old lane name, holds the same public jars: better than a download.
          restore-keys: |
            ${{ runner.os }}-robolectric-v1-inline-code-
            ${{ runner.os }}-robolectric-v1-
      - name: Validate the minutes state and render Android progress
        working-directory: android
        run: |
          git rev-parse HEAD:android HEAD:spec/fixtures/minutes-wait
          ./gradlew --no-daemon --no-watch-fs --console=plain --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            -PpersonaApplicationId=com.example.persona -PpersonaGoogleOAuthScheme=persona.oauth.unset \
            -PpersonaRepoRoot="$GITHUB_WORKSPACE" :feature:knowledge:testDebugUnitTest \
            --tests persona.feature.knowledge.KnowledgeMinutesTest \
            --tests persona.feature.knowledge.KnowledgeMinutesShotsTest \
            --tests persona.feature.knowledge.KnowledgeMinutesTimeTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-minutes-progress
          retention-days: 7
          path: |
            android/feature/knowledge/build/i18n-shots/knowledge-minutes-final-pass-*.png
            android/feature/knowledge/build/test-results/testDebugUnitTest/
