const keyState=()=>{const p=new URLSearchParams(location.hash.slice(1));return {page:pages.some(x=>x.id===p.get('page'))?p.get('page'):pages[0].id,mode:modeBtns[p.get('mode')]?p.get('mode'):'light',width:widthBtns[p.get('width')]?p.get('width'):'matched',section:['worktrees','sources'].includes(p.get('section'))?p.get('section'):'page'}};
const href=s=>s.section==='page'?'#'+new URLSearchParams({page:s.page,mode:s.mode,width:s.width}):'#section='+s.section;
const set=(s,params)=>{location.hash=href(Object.assign({},s,params));};
const closeNav=()=>{document.getElementById('side').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')};
document.getElementById('menu').onclick=()=>{const s=document.getElementById('side');document.getElementById('menu').setAttribute('aria-expanded',String(s.classList.toggle('open')))};
function directory(s){const term=find.value.trim().toLocaleLowerCase();const groups=new Map();for(const p of pages){if(![p.id,p.title,p.english,p.group,p.task].some(v=>v.toLocaleLowerCase().includes(term))) continue;if(!groups.has(p.group))groups.set(p.group,[]);groups.get(p.group).push(p)}
 nav.innerHTML=[...groups].map(([g,items])=>'<h3>'+html(g)+'</h3>'+items.map(p=>'<a data-page="'+p.id+'" '+(s.section==='page'&&p.id===s.page?'aria-current="page"':'')+' href="'+html(href({...s,section:'page',page:p.id}))+'">'+html(p.title)+'</a>').join('')).join('')||'<p>没有匹配的页面。</p>'}
function controls(label,buttons,k,s){return '<div class="control"><small>'+label+'</small><div class="seg" role="group" aria-label="'+label+'">'+Object.entries(buttons).map(([key,name])=>'<button data-control="'+k+'" data-value="'+key+'" aria-pressed="'+(s[k]===key)+'">'+name+'</button>').join('')+'</div></div>'}
function urlFor(p,m,k,part){return local?local.pages[p.id][m][k][part]:p.originals.file;}
function asset(p,m,k){const f=p.modes[m],rec=f.devices[k],src=pictures?pictures[f.board.file]:f.board.file,[x,y,w,h]=f.board.crops[k], [bw,bh]=f.board.dimensions, n=D.devices[k];
 const name=n.label+' · '+n.width;const art='<svg class="phone" xmlns="http://www.w3.org/2000/svg" viewBox="'+[x,y,w,h].join(' ')+'" role="img" aria-label="'+html(p.title+' '+name)+'"><image href="'+html(src)+'" width="'+bw+'" height="'+bh+'"/></svg>';
 const anchor=local?'<a class="visual" href="'+html(urlFor(p,m,k,'png'))+'" title="打开原始 PNG">'+art+'</a>':art;
 const raw=local?links('PNG',urlFor(p,m,k,'png'))+' '+links('控件树',urlFor(p,m,k,'ax')):links('原件 ZIP',p.originals.file);
 return '<figure data-device="'+k+'"><figcaption><strong>'+html(name)+'</strong><span>'+raw+'</span></figcaption>'+anchor+'</figure>';}
function attestation(p,m,keys){return '<details><summary>图像、控件树与来源指纹</summary>'+keys.map(k=>{const r=p.modes[m].devices[k],a=D.devices[k];return '<h3>'+html(a.label+' · '+a.width)+'</h3><p>'+html(r.pixels.join(' × ')+' px · '+r.capturedAt+' · 字号 '+r.fontSetting)+'</p><p>PNG <code>'+r.pngSHA256+'</code><br>AX <code>'+r.axSHA256+'</code><br>源提交 <code>'+r.source+'</code></p>'}).join('')+'<p>画板 SHA-256 <code>'+p.modes[m].board.sha256+'</code></p></details>';}
function page(s){const p=pages.find(t=>t.id===s.page),idx=pages.indexOf(p);const keys=s.width==='both'?['iphone','matched','standard']:['iphone',s.width];
 document.title=p.title+' · Persona 手机端对照';main.innerHTML='<header><div><div class="path">'+html(p.group)+' · '+(idx+1)+' / '+pages.length+'</div><h1>'+html(p.title)+'</h1></div><div class="paging"><button id="prev" '+(!idx?'disabled':'')+'>上一页</button><button id="next" '+(idx===pages.length-1?'disabled':'')+'>下一页</button></div></header><p>'+html(p.task)+'</p>'+(p.route?'<p class="path">'+html(p.route)+'</p>':'')+'<div class="controls">'+controls('外观',modeBtns,'mode',s)+controls('鸿蒙对照宽度',widthBtns,'width',s)+'</div><div class="grid '+(keys.length===3?'triple':'')+'">'+keys.map(k=>asset(p,s.mode,k)).join('')+'</div>'+(!local?'<p class="notice">完整尺寸 PNG 和原生控件树按页面打包。离线精简版可将对应单页 ZIP 保存到同层 originals 目录，或从维护者索引的原件列下载。</p>':'')+attestation(p,s.mode,keys);
 document.getElementById('prev').onclick=()=>set(s,{page:pages[idx-1].id});document.getElementById('next').onclick=()=>set(s,{page:pages[idx+1].id});main.querySelectorAll('[data-control]').forEach(b=>b.onclick=()=>set(s,{[b.dataset.control]:b.dataset.value}));}
const steps={'baseline':'记录基线','create-verified':'新建并核对 Git 分支与目录','rename-verified':'改显示名并核对同一目录','dirty-preview':'查看 1 项未提交改动','dirty-cancel-verified':'取消后文件仍在','cleanup-verified':'确认清理并核对 Hub、分支和目录'};
function worktrees(){document.title='真实工作树往返 · Persona';main.innerHTML='<h1>真实工作树往返</h1><p>已配对的 Mate 在一次性 Git 仓库经原生界面完成两轮新建、改名、查看脏改动、取消和清理。每轮结束后主分支 HEAD 与基线相同，设备保留原配对。</p>'+D.pairedWorktrees.cycles.map((c,i)=>'<section class="panel"><h2>第 '+(i+1)+' 轮 · '+html(c.branch)+'</h2><div class="overflow"><table><tr><th>操作</th><th>完成时间</th><th>截图证据</th></tr>'+Object.entries(c.steps).map(([id,v])=>'<tr><td>'+steps[id]+'</td><td>'+html(v.at)+'</td><td>'+(v.screenshot?(local?links('原始 PNG',local.worktrees[i].screenshots[id]):'<code>'+v.screenshot.slice(0,14)+'…</code>'):'—')+'</td></tr>').join('')+'</table></div><p>操作记录 SHA-256 <code>'+c.receiptSHA256+'</code></p>'+(local?'<p>'+links('打开本机原始操作记录',local.worktrees[i].journal)+'</p>':'')+'</section>').join('')+'<p class="notice">配对实例的原始操作图和日志仅保存在本机。公开目录保留操作时间、结果及原始文件摘要。</p>';}
function sources(){document.title='版本与取证 · Persona';main.innerHTML='<h1>版本与取证</h1><p>37 个页面、3 种外观、111 个画板。每个画板来自同命名状态的 3 张独立原生截图，共 333 张 PNG 和 333 棵控件树。</p><section class="panel"><h2>鸿蒙</h2><p>实测源 <code>'+D.capturedHarmonySource+'</code><br>画廊测试 HAP <code>'+D.harmonySyntheticHapSHA256+'</code><br>真实配对 HAP <code>'+D.pairedWorktrees.hapSHA256+'</code></p><p>402 vp 为与 iPhone 同宽的客体，365 vp 为 Mate 标准客体。两种宽度运行同一份测图 HAP。</p><h2>iPhone</h2><p>'+html(D.appleSimulation.device+' · iOS '+D.appleSimulation.system)+' · 402 pt<br>实测源 <code>'+D.capturedAppleSource+'</code><br>原生测试清单 <code>'+D.sourceReceiptsSHA256['iPhone-manifest.json']+'</code></p><h2>公开源码对照</h2><p>公开提交 <code>'+D.publicHeadCompared+'</code> 的应用源码树与拍摄时的版本逐字相同。完整画板保留系统安全区、键盘和原生字体。</p></section><p class="notice">合成服务的时钟、实时数值与系统控件可能跨平台不同。本画廊记录实际呈现，逐页截图本身不能证明每一次交互等价。</p>';}
function render(){const s=keyState();directory(s);if(s.section==='worktrees') worktrees();else if(s.section==='sources')sources();else page(s);closeNav();}
find.oninput=()=>directory(keyState());window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
